

<div class="my-leaves-box">
   

  <h2>My Leave Requests</h2>

  <table>

    <thead>
      <tr>
        <th>From Date</th>
        <th>To Date</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Applied Date</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let leave of myleaves">

        <td>{{ leave.fromdate }}</td>
        <td>{{ leave.todate }}</td>
        <td>{{ leave.reason }}</td>
        <td>{{ leave.status }}</td>
        <td>{{ leave.applieddate }}</td>

      </tr>

    </tbody>

  </table>

  



</div>
