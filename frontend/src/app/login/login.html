<div class="login-box">
<h1>Login</h1>

<h2>Enter Email:</h2>
<input type="email" placeholder="Email" [(ngModel)]="email"/>

<h2>Enter Password:</h2>
<input type="password" placeholder="Password" [(ngModel)]="password"/>

<br>
<input type="button" value="Login" class="login-button" (click)="login()" />
<br><br>
<input type="button" value="Register" class="register-button" (click)="goToRegistration()" /> 


<br>

</div>
